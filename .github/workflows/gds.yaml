name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    env:
      COLUMNS: 220            # so LibreLane's summary tables (timing per corner) aren't cut off
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp27a
        with:
          pdk: ihp-sg13cmos5l # or ihp-sg13g2

      - name: Timing report (worst paths per corner)
        if: always()
        run: |
          d=$(ls -d runs/wokwi/*-openroad-stapostpnr 2>/dev/null | tail -1)
          [ -n "$d" ] || { echo "no post-PnR STA directory"; exit 0; }
          find "$d" -maxdepth 2 -type f | sort
          for f in "$d"/summary.rpt "$d"/*/summary.rpt; do [ -f "$f" ] && { echo "=== $f"; cat "$f"; }; done
          for c in "$d"/nom_*; do
            for f in "$c"/max.rpt "$c"/max_*.rpt; do
              [ -f "$f" ] && { echo "=== $f"; head -n 160 "$f"; }
            done
          done

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp27a

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp27a
