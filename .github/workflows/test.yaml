name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make COMPILE_ARGS="-I../src -DDUMP_CORE"   # dump the fuzzer's core too, for coverage
          # make will return success even if the tests fail, so check results.xml for failed tests
          python -m cocotb_tools.check_results results.xml

      - name: Toggle coverage
        run: |
          pip install pywellen
          python tools/toggle_cov.py test/tb.fst --min 98 | tee test/coverage.txt

      - name: Formal proofs
        run: |
          pip install yowasp-yosys
          sh formal/run.sh
          sh formal/mutants.sh    # each deliberately broken RTL must fail a proof

      - name: Tool tests (assembler, CAN / motor helpers, virtual board)
        run: |
          pip install pytest
          python -m pytest -q sw/test_tools.py

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/coverage.txt
            test/output/*
