<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d3b2f"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#1d3b2f;stroke-width:1.5}
      .hc{fill:#eef6f1;stroke:#0f5c3f;stroke-width:1.5}
      .v{fill:#fff4e6;stroke:#b0681f;stroke-width:1.5}
      .proof{fill:#f4f2ec;stroke:#0f5c3f;stroke-width:2;stroke-dasharray:6 4}
      .si{fill:#14231b;stroke:#14231b}
      .t{fill:#14231b}
      .w{fill:#ffffff}
      .h{fill:#14231b;font-weight:bold;font-size:15px}
      .hw{fill:#ffffff;font-weight:bold;font-size:15px}
      .s{fill:#566a5f;font-size:11.5px}
      .sw{fill:#c9d6cf;font-size:11.5px}
      .ln{stroke:#1d3b2f;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .lnb{stroke:#0f5c3f;stroke-width:1.4;fill:none;marker-end:url(#a);marker-start:url(#a)}
    </style>
  </defs>
  <rect width="960" height="430" fill="#f4f2ec"/>
  <text x="24" y="34" class="h" font-size="18">Two descriptions of one chip, proven equal</text>
  <text x="24" y="54" class="s">The chip is taped out from the Verilog that Hardcaml generates; the hand-written Verilog is the reference it is checked against.</text>

  <!-- Hardcaml -->
  <rect x="24" y="86" width="210" height="108" rx="8" class="hc"/>
  <text x="129" y="112" text-anchor="middle" class="h">Hardcaml (OCaml)</text>
  <text x="129" y="132" text-anchor="middle" class="s">hardcaml/src/</text>
  <text x="129" y="152" text-anchor="middle" class="t">engine.ml, core.ml,</text>
  <text x="129" y="170" text-anchor="middle" class="t">host_spi.ml, chip.ml</text>

  <path d="M234,140 L300,140" class="ln"/>
  <text x="267" y="130" text-anchor="middle" class="s">generate</text>

  <rect x="302" y="86" width="210" height="108" rx="8" class="box"/>
  <text x="407" y="112" text-anchor="middle" class="h">Generated Verilog</text>
  <text x="407" y="132" text-anchor="middle" class="s">hardcaml/build/project.v</text>
  <text x="407" y="152" text-anchor="middle" class="t">committed as</text>
  <text x="407" y="170" text-anchor="middle" class="t">src/hardcaml_chip.v</text>

  <path d="M512,140 L578,140" class="ln"/>
  <text x="545" y="130" text-anchor="middle" class="s">tape out</text>

  <rect x="580" y="86" width="356" height="108" rx="8" class="si"/>
  <text x="758" y="112" text-anchor="middle" class="hw">LibreLane: Yosys + OpenROAD</text>
  <text x="758" y="134" text-anchor="middle" class="sw">GDS, precheck (KLayout DRC, LVS), gate-level tests</text>
  <text x="758" y="158" text-anchor="middle" class="w">40 MHz rated at 1.08 V, 125 C</text>
  <text x="758" y="178" text-anchor="middle" class="sw">7.47 ns slack there (57 MHz); 90 MHz typical</text>

  <!-- proof -->
  <rect x="302" y="226" width="210" height="96" rx="8" class="proof"/>
  <text x="407" y="250" text-anchor="middle" class="h">Equivalence proof</text>
  <text x="407" y="270" text-anchor="middle" class="t">every register and output,</text>
  <text x="407" y="288" text-anchor="middle" class="t">every clock (Yosys induction)</text>
  <text x="407" y="308" text-anchor="middle" class="s">whole chip: 3,295 $equiv cells</text>
  <path d="M407,196 L407,224" class="lnb"/>

  <!-- hand-written -->
  <rect x="24" y="226" width="210" height="96" rx="8" class="v"/>
  <text x="129" y="252" text-anchor="middle" class="h">Hand-written Verilog</text>
  <text x="129" y="272" text-anchor="middle" class="s">src/ (the reference)</text>
  <text x="129" y="292" text-anchor="middle" class="t">pe_engine.v, pe_core.v,</text>
  <text x="129" y="310" text-anchor="middle" class="t">host_spi.v, project.v</text>
  <path d="M236,274 L300,274" class="lnb"/>

  <!-- tests -->
  <rect x="580" y="226" width="356" height="96" rx="8" class="box"/>
  <text x="758" y="252" text-anchor="middle" class="h">The same tests on both</text>
  <text x="758" y="274" text-anchor="middle" class="t">35 cocotb tests, golden model compared every clock,</text>
  <text x="758" y="292" text-anchor="middle" class="t">device models of the rover's parts</text>
  <text x="758" y="310" text-anchor="middle" class="s">make / make HARDCAML=chip</text>
  <path d="M514,274 L578,274" class="ln" stroke-dasharray="4 3"/>

  <!-- CI + lesson -->
  <rect x="24" y="346" width="912" height="62" rx="8" class="box"/>
  <text x="40" y="370" class="t" font-weight="bold">CI on every push</text>
  <text x="168" y="370" class="t">regenerate the Verilog from the OCaml, check it equals src/hardcaml_chip.v, re-run every proof.</text>
  <text x="40" y="394" class="t" font-weight="bold">Planted bugs</text>
  <text x="168" y="394" class="t">three one-line changes to engine.ml each fail the proof, so it is checking something.</text>
</svg>
